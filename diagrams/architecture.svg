<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gwGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B066FF"/><stop offset="1" stop-color="#8C4FFF"/>
    </linearGradient>
    <linearGradient id="sqsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F34F8C"/><stop offset="1" stop-color="#E7157B"/>
    </linearGradient>
    <linearGradient id="lamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F79B36"/><stop offset="1" stop-color="#ED7100"/>
    </linearGradient>
    <linearGradient id="cwGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F34F8C"/><stop offset="1" stop-color="#B0084D"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrowG" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#06AC38"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#FAFBFC"/>
  <text x="960" y="70" text-anchor="middle" font-size="42" font-weight="bold" fill="#232F3E">PagerDuty Webhook Processing on AWS — Architecture</text>
  <text x="960" y="112" text-anchor="middle" font-size="22" fill="#5F6B7A">Email-triggered incidents → conditional Incident Workflow execution via serverless processing</text>

  <!-- Email source -->
  <g filter="url(#shadow)">
    <rect x="60" y="240" width="220" height="150" rx="14" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="2"/>
    <rect x="120" y="265" width="100" height="66" rx="8" fill="#5F6B7A"/>
    <path d="M120 265 L170 305 L220 265" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <text x="170" y="362" text-anchor="middle" font-size="20" font-weight="bold" fill="#232F3E">Email Sender</text>
  </g>

  <!-- PagerDuty service -->
  <g filter="url(#shadow)">
    <rect x="360" y="200" width="300" height="230" rx="14" fill="#FFFFFF" stroke="#06AC38" stroke-width="3"/>
    <rect x="470" y="222" width="80" height="80" rx="16" fill="#06AC38"/>
    <text x="510" y="278" text-anchor="middle" font-size="40" font-weight="bold" fill="#FFFFFF">PD</text>
    <text x="510" y="332" text-anchor="middle" font-size="21" font-weight="bold" fill="#232F3E">PagerDuty Service</text>
    <text x="510" y="360" text-anchor="middle" font-size="16" fill="#5F6B7A">Email Integration</text>
    <text x="510" y="384" text-anchor="middle" font-size="15" fill="#5F6B7A">Email rules / filters only —</text>
    <text x="510" y="405" text-anchor="middle" font-size="15" fill="#5F6B7A">no Event Orchestration</text>
  </g>

  <!-- API Gateway -->
  <g filter="url(#shadow)">
    <rect x="740" y="200" width="300" height="230" rx="14" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="3"/>
    <rect x="850" y="222" width="80" height="80" rx="16" fill="url(#gwGrad)"/>
    <text x="890" y="277" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">&lt;/&gt;</text>
    <text x="890" y="332" text-anchor="middle" font-size="21" font-weight="bold" fill="#232F3E">Amazon API Gateway</text>
    <text x="890" y="360" text-anchor="middle" font-size="16" fill="#5F6B7A">HTTP API “webhook”</text>
    <text x="890" y="384" text-anchor="middle" font-size="15" fill="#5F6B7A">Route: POST /webhook</text>
    <text x="890" y="405" text-anchor="middle" font-size="15" fill="#5F6B7A">Stage: dev (auto-deploy)</text>
  </g>

  <!-- SQS -->
  <g filter="url(#shadow)">
    <rect x="1120" y="200" width="300" height="230" rx="14" fill="#FFFFFF" stroke="#E7157B" stroke-width="3"/>
    <rect x="1230" y="222" width="80" height="80" rx="16" fill="url(#sqsGrad)"/>
    <circle cx="1252" cy="262" r="9" fill="#FFFFFF"/><circle cx="1276" cy="262" r="9" fill="#FFFFFF"/><circle cx="1298" cy="262" r="9" fill="#FFFFFF" opacity="0.6"/>
    <text x="1270" y="332" text-anchor="middle" font-size="21" font-weight="bold" fill="#232F3E">Amazon SQS</text>
    <text x="1270" y="360" text-anchor="middle" font-size="16" fill="#5F6B7A">Webhook-processing-project</text>
    <text x="1270" y="384" text-anchor="middle" font-size="15" fill="#5F6B7A">Standard queue · SSE-SQS</text>
    <text x="1270" y="405" text-anchor="middle" font-size="15" fill="#5F6B7A">us-east-1</text>
  </g>

  <!-- DLQ -->
  <g filter="url(#shadow)">
    <rect x="1160" y="490" width="220" height="110" rx="12" fill="#FFF5F9" stroke="#E7157B" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="1270" y="535" text-anchor="middle" font-size="17" font-weight="bold" fill="#232F3E">Dead-Letter Queue</text>
    <text x="1270" y="560" text-anchor="middle" font-size="14" fill="#5F6B7A">…-project-dql</text>
    <text x="1270" y="582" text-anchor="middle" font-size="14" fill="#5F6B7A">Max receives: 3</text>
  </g>
  <line x1="1270" y1="430" x2="1270" y2="490" stroke="#E7157B" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow)"/>

  <!-- Lambda -->
  <g filter="url(#shadow)">
    <rect x="1520" y="200" width="330" height="230" rx="14" fill="#FFFFFF" stroke="#ED7100" stroke-width="3"/>
    <rect x="1645" y="222" width="80" height="80" rx="16" fill="url(#lamGrad)"/>
    <text x="1685" y="282" text-anchor="middle" font-size="46" font-weight="bold" fill="#FFFFFF">λ</text>
    <text x="1685" y="332" text-anchor="middle" font-size="21" font-weight="bold" fill="#232F3E">AWS Lambda</text>
    <text x="1685" y="360" text-anchor="middle" font-size="15" fill="#5F6B7A">Webhook-processing-project-lambda</text>
    <text x="1685" y="384" text-anchor="middle" font-size="15" fill="#5F6B7A">Node.js 24.x · 128 MB · 6 s timeout</text>
    <text x="1685" y="405" text-anchor="middle" font-size="15" fill="#5F6B7A">SQS event source mapping</text>
  </g>

  <!-- CloudWatch -->
  <g filter="url(#shadow)">
    <rect x="1550" y="490" width="270" height="110" rx="12" fill="#FFFFFF" stroke="#B0084D" stroke-width="2"/>
    <rect x="1575" y="510" width="56" height="56" rx="12" fill="url(#cwGrad)"/>
    <circle cx="1603" cy="538" r="16" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="1603" y1="538" x2="1603" y2="527" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="1603" y1="538" x2="1612" y2="543" stroke="#FFFFFF" stroke-width="4"/>
    <text x="1725" y="535" text-anchor="middle" font-size="17" font-weight="bold" fill="#232F3E">CloudWatch Logs</text>
    <text x="1725" y="560" text-anchor="middle" font-size="13" fill="#5F6B7A">/aws/lambda/Webhook-</text>
    <text x="1725" y="578" text-anchor="middle" font-size="13" fill="#5F6B7A">processing-project-lambda</text>
  </g>
  <line x1="1685" y1="430" x2="1685" y2="490" stroke="#B0084D" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Flow arrows top row -->
  <line x1="280" y1="315" x2="352" y2="315" stroke="#232F3E" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="316" y="298" text-anchor="middle" font-size="14" fill="#5F6B7A">email</text>

  <line x1="660" y1="315" x2="732" y2="315" stroke="#232F3E" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="696" y="285" text-anchor="middle" font-size="14" fill="#5F6B7A">V3 webhook</text>
  <text x="696" y="303" text-anchor="middle" font-size="14" fill="#5F6B7A">incident.triggered</text>

  <line x1="1040" y1="315" x2="1112" y2="315" stroke="#232F3E" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1076" y="285" text-anchor="middle" font-size="14" fill="#5F6B7A">SendMessage</text>
  <text x="1076" y="303" text-anchor="middle" font-size="14" fill="#5F6B7A">$request.body</text>

  <line x1="1420" y1="315" x2="1512" y2="315" stroke="#232F3E" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1466" y="285" text-anchor="middle" font-size="14" fill="#5F6B7A">poll / trigger</text>
  <text x="1466" y="303" text-anchor="middle" font-size="14" fill="#5F6B7A">(batch)</text>

  <!-- PagerDuty REST API box bottom -->
  <g filter="url(#shadow)">
    <rect x="360" y="680" width="1090" height="290" rx="14" fill="#FFFFFF" stroke="#06AC38" stroke-width="3"/>
    <rect x="400" y="712" width="70" height="70" rx="14" fill="#06AC38"/>
    <text x="435" y="760" text-anchor="middle" font-size="34" font-weight="bold" fill="#FFFFFF">PD</text>
    <text x="500" y="742" font-size="22" font-weight="bold" fill="#232F3E">PagerDuty REST API</text>
    <text x="500" y="772" font-size="16" fill="#5F6B7A">api.pagerduty.com</text>

    <text x="400" y="830" font-size="17" fill="#232F3E">1.  GET /incidents/{id}?include[]=first_trigger_log_entries  →  read email body (channel.body)</text>
    <text x="400" y="868" font-size="17" fill="#232F3E">2.  Regex scan for “incident workflow” (case-insensitive)</text>
    <text x="400" y="912" font-size="17" fill="#06AC38" font-weight="bold">✓ Match:  POST note + POST /incident_workflows/PYW8VXV/instances  →  workflow runs</text>
    <text x="400" y="948" font-size="17" fill="#B0084D" font-weight="bold">✗ No match:  POST /incidents/{id}/notes  →  “match failed, skipping trigger” note only</text>
  </g>

  <!-- Lambda to PD API arrow -->
  <path d="M1532,430 L1532,645 L960,645 L960,672" fill="none" stroke="#06AC38" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="1250" y="668" text-anchor="middle" font-size="15" fill="#06AC38" font-weight="bold">REST API calls (Token auth)</text>

  <!-- Region annotation -->
  <rect x="720" y="160" width="1150" height="470" rx="18" fill="none" stroke="#FF9900" stroke-width="2.5" stroke-dasharray="12 8"/>
  <text x="760" y="185" font-size="17" font-weight="bold" fill="#FF9900">AWS · us-east-1</text>
</svg>
